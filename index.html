<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🧪 班组试剂云库存</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/leancloud-storage@4/dist/av-min.js"></script>
<style>
:root{--c1:#0ea5e9;--c2:#0d9488;--danger:#ef4444;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:var(--bg);color:var(--text);padding:15px}
.container{max-width:900px;margin:auto;display:flex;flex-direction:column;gap:15px}
.header{background:linear-gradient(135deg,var(--c1),var(--c2));padding:20px;border-radius:10px;text-align:center;position:relative}
.sync{position:absolute;right:15px;top:15px;font-size:12px;opacity:.7}
.card{background:var(--card);border-radius:8px;padding:15px;border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,button{padding:8px 10px;border-radius:6px;border:1px solid var(--border)}
input,select{flex:1;background:#0f172a;color:var(--text)}
button{background:var(--c1);color:#fff;border:none;cursor:pointer}
button.danger{background:var(--danger)}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-left:4px solid var(--c2);margin-bottom:8px;border-radius:4px;background:#0f172a}
.item.low{border-left-color:var(--danger)}
.item span:first-child{font-weight:600}
@media(max-width:600px){.row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="sync" id="sync">同步中…</span>
    <h2>🧪 班组云库存（GitHub 版）</h2>
  </div>
  <div class="card">
    <form id="form" class="row">
      <select id="team" required><option value="">选择班组</option><option>分析一工段</option><option>分析二工段</option><option>分析三工段</option><option>分析四工段</option></select>
      <input id="name" placeholder="试剂名称" required>
      <input id="qty" type="number" min="0" placeholder="数量" required>
      <select id="unit"><option>瓶</option><option>盒</option><option>支</option><option>袋</option></select>
      <input id="loc" placeholder="位置（可选）">
      <button type="submit">保存</button>
      <button type="button" id="cancel" style="display:none">取消</button>
    </form>
  </div>
  <div class="card"><input id="search" placeholder="🔍 搜索试剂 / 班组 / 位置"></div>
  <div class="card" id="list">加载中…</div>
</div>

<script>
AV.init({
  appId: "1BWbSGDhdP7q0pRhPtmUtBEo-gzGzoHsz",
  appKey: "jNus8tfVihLpzi8uPtpdfjMG",
  serverURL: "https://1bwbsgdh.leancloud.cn"
})
const Reagent = AV.Object.extend('Reagent')
let editObj = null
function render(list){
  const kw = document.getElementById('search').value.trim().toLowerCase()
  const html = list.filter(i=>
    !kw || i.get('name').toLowerCase().includes(kw) || i.get('team').toLowerCase().includes(kw) || (i.get('loc')||'').toLowerCase().includes(kw)
  ).map(i=>{
    const qty = i.get('qty')
    return `<div class="item ${qty<10?'low':''}">
      <span>${i.get('name')}</span>
      <span>${qty} ${i.get('unit')}</span>
      <span>${i.get('team')}</span>
      <span>${i.get('loc')||'—'}</span>
      <button onclick="editItem('${i.id}')">✏️</button>
      <button class="danger" onclick="delItem('${i.id}')">🗑️</button>
    </div>`
  }).join('')
  document.getElementById('list').innerHTML = html || '<div style="text-align:center;color:#94a3b8">暂无数据</div>'
  document.getElementById('sync').textContent = '已同步 ' + new Date().toLocaleTimeString()
}
function renderList(){
  new AV.Query(Reagent).ascending('createdAt').find().then(render)
}
document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault()
  const obj = editObj || new Reagent()
  obj.set('team', document.getElementById('team').value)
  obj.set('name', document.getElementById('name').value.trim())
  obj.set('qty', Number(document.getElementById('qty').value))
  obj.set('unit', document.getElementById('unit').value)
  obj.set('loc', document.getElementById('loc').value.trim())
  obj.save().then(()=>{ cancelEdit(); renderList(); e.target.reset() })
})
function editItem(id){
  new AV.Query(Reagent).get(id).then(i=>{
    document.getElementById('team').value = i.get('team')
    document.getElementById('name').value = i.get('name')
    document.getElementById('qty').value = i.get('qty')
    document.getElementById('unit').value = i.get('unit')
    document.getElementById('loc').value = i.get('loc')||''
    editObj = i
    document.getElementById('cancel').style.display = 'inline-block'
  })
}
function cancelEdit(){ editObj = null; document.getElementById('form').reset(); document.getElementById('cancel').style.display='none' }
document.getElementById('cancel').onclick = cancelEdit
function delItem(id){
  if(confirm('确定删除？')) new AV.Query(Reagent).get(id).then(i=>i.destroy()).then(renderList)
}
document.getElementById('search').addEventListener('input', renderList)
renderList()
</script>
</body>
</html>
