<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🧪 班组试剂库存（纯本地版）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--c1:#0ea5e9;--c2:#0d9488;--danger:#ef4444;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:var(--bg);color:var(--text);padding:15px}
.container{max-width:900px;margin:auto;display:flex;flex-direction:column;gap:15px}
.header{background:linear-gradient(135deg,var(--c1),var(--c2));padding:20px;border-radius:10px;text-align:center}
.card{background:var(--card);border-radius:8px;padding:15px;border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,button{padding:8px 10px;border-radius:6px;border:1px solid var(--border)}
input,select{flex:1;background:#0f172a;color:var(--text)}
button{background:var(--c1);color:#fff;border:none;cursor:pointer}
button.danger{background:var(--danger)}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-left:4px solid var(--c2);margin-bottom:8px;border-radius:4px;background:#0f172a}
.item.low{border-left-color:var(--danger)}
.item span:first-child{font-weight:600}
@media(max-width:600px){.row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h2>🧪 班组库存（纯本地版）</h2></div>
  <div class="card">
    <form id="form" class="row">
      <select id="team" required><option value="">选择班组</option><option>分析一工段</option><option>分析二工段</option><option>分析三工段</option><option>分析四工段</option></select>
      <input id="name" placeholder="试剂名称" required>
      <input id="qty" type="number" min="0" placeholder="数量" required>
      <select id="unit"><option>瓶</option><option>盒</option><option>支</option><option>袋</option></select>
      <input id="loc" placeholder="位置（可选）">
      <button type="submit">保存</button>
      <button type="button" id="cancel" style="display:none">取消</button>
    </form>
  </div>
  <div class="card"><input id="search" placeholder="🔍 搜索试剂 / 班组 / 位置"></div>
  <div class="card" id="list">加载中…</div>
</div>

<script>
// ====== 纯本地数据 ======
let data = JSON.parse(localStorage.getItem('inventory') || '[]');
let editId = null;

function save() {
  localStorage.setItem('inventory', JSON.stringify(data));
}

function render() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const filtered = data.filter(i =>
    !kw || i.name.toLowerCase().includes(kw) || i.team.toLowerCase().includes(kw) || (i.loc || '').toLowerCase().includes(kw)
  );
  const html = filtered.map(i => `
    <div class="item ${i.qty < 10 ? 'low' : ''}">
      <span>${i.name}</span>
      <span>${i.qty} ${i.unit}</span>
      <span>${i.team}</span>
      <span>${i.loc || '—'}</span>
      <button onclick="editItem('${i.id}')">✏️</button>
      <button class="danger" onclick="delItem('${i.id}')">🗑️</button>
    </div>
  `).join('');
  document.getElementById('list').innerHTML = html || '<div style="text-align:center;color:#94a3b8">暂无数据</div>';
}

function editItem(id) {
  const i = data.find(x => x.id === id);
  if (!i) return;
  document.getElementById('team').value = i.team;
  document.getElementById('name').value = i.name;
  document.getElementById('qty').value = i.qty;
  document.getElementById('unit').value = i.unit;
  document.getElementById('loc').value = i.loc || '';
  editId = id;
  document.getElementById('cancel').style.display = 'inline-block';
}

function cancelEdit() {
  editId = null;
  document.getElementById('form').reset();
  document.getElementById('cancel').style.display = 'none';
}

function delItem(id) {
  if (!confirm('确定删除？')) return;
  data = data.filter(x => x.id !== id);
  save();
  render();
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const item = {
    id: editId || Date.now().toString(),
    team: document.getElementById('team').value,
    name: document.getElementById('name').value.trim(),
    qty: Number(document.getElementById('qty').value),
    unit: document.getElementById('unit').value,
    loc: document.getElementById('loc').value.trim()
  };
  if (editId) {
    const idx = data.findIndex(x => x.id === editId);
    data[idx] = item;
  } else {
    data.push(item);
  }
  save();
  cancelEdit();
  e.target.reset();
  render();
});

document.getElementById('cancel').onclick = cancelEdit;
document.getElementById('search').addEventListener('input', render);

// 首次渲染
render();
</script>
</body>
</html>
